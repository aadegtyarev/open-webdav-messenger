name: PR checks

# Secret scanning runs in CI; Gradle checks run locally before pushing.
on:
  pull_request:
    branches: [main]

# Least privilege: the checks only read the repository.
permissions:
  contents: read

jobs:
  review-gates:
    runs-on: ubuntu-latest
    env:
      # Pinned gitleaks release. Bump deliberately (and re-verify the URL) — never float.
      GITLEAKS_VERSION: '8.30.1'
    steps:
      # Full history lets gitleaks scan commits beyond the tip working tree.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pinned gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --verbose
